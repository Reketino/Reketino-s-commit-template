name: PR Summary

on:
    pull_request:
        types: [opened, synchronize]

permissions: 
    pull-requests: write

jobs: 
    update-pr:
        runs-on: ubuntu-latest

        steps:
            - name: Generate PR title and body
              uses: actions/github-script@v7
              with:
                script: |
                    const fs = require("fs");
                    
                    const owner = context.repo.owner;
                    const repo = context.repo.repo;
                    const pull_number = context.payload.pull_request.number;

                    const labels = JSON.parse(
                        fs.readFileSync(".github/config/labels.json", "utf8")
                    );
                    const types = labels.map(label => label.name);
                    const regex = new RegExp(
                        `^(${types.join("|")})(\\([^)]+\\))?:`
                    );

                    const commits = await github.rest.pulls.listCommits({
                        owner,
                        repo,
                        pull_number
                    });

                    const messages = commits.data.map(
                        commit => commit.commit.message.split("\n")[0]
                    );

                    if (messages.length === 0) {
                        return;
                    }
                    
                    const title = messages[0];

                    const body = [
                        "## Commits Included",
                        "",
                        ...messages.map(msg => `- ${msg}`)
                    ].join("\n");

                    await github.rest.pulls.update({
                        owner,
                        repo,
                        pull_number,
                        title,
                        body,
                    });

                    console.log(`Updated PR #${pull_number}`);
