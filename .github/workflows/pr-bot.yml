name: PR BOT

on:
    pull_request:
      types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  validate-and-label:
    runs-on: ubunutu-latest

    steps:
      - name: Validate PR title + apply label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;

            const types = [
            "build",
            "chore",
            "ci",
            "docs",
            "feat",
            "fix",
            "perf",
            "refactor",
            "style",
            "test",
            ];

            const match = title.match(/^(\w+)(\(-).+\))?:/);

            if (!match || !types.includes(match[1])) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: ` Invalid PR title format hombre.            
Use:
feat: add login
fix: resolve crash
refactor(auth): simplify logic

Allowed types: 
${types.join(", ")}`
              });

              return;
            }


            

